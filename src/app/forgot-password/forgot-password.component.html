<div style="display: flex; height: 100vh; width: 100vw; background-color: #0f1016; direction: rtl; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  
  <!-- بخش فرم بازیابی در سمت چپ -->
  <div style="flex: 1; display: flex; justify-content: center; align-items: center; background-color: #0f1016;">
    <div style="background-color: #1a1c23; padding: 40px; border-radius: 20px; width: 420px; color: white; box-shadow: 0 15px 35px rgba(0,0,0,0.6); box-sizing: border-box; border: 1px solid rgba(255,255,255,0.05);">
      
      <div style="text-align: center; margin-bottom: 25px;">
        <div style="width: 55px; height: 55px; background: linear-gradient(135deg, #ec4899 0%, #3b82f6 100%); border-radius: 14px; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);">🔑</div>
        <h2 style="margin: 0 0 8px 0; font-size: 24px; font-weight: bold; color: white;">بازیابی رمز عبور</h2>
        <p style="margin: 0; color: #9ca3af; font-size: 13px;">ایمیل و رمز عبور جدید خود را وارد کنید</p>
      </div>

      <!-- پیغام موفقیت -->
      <div *ngIf="successMessage" style="background-color: rgba(16, 185, 129, 0.15); color: #34d399; padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 13px; font-weight: bold; border: 1px solid rgba(52, 211, 153, 0.3);">
        {{ successMessage }}
      </div>
      
      <form (ngSubmit)="onResetPassword()">
        <div style="margin-bottom: 18px;">
          <label style="display: block; margin-bottom: 6px; font-size: 13px; color: #d1d5db;">ایمیل کاربری</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="name@example.com" 
                 style="width: 100%; padding: 13px; background-color: #262833; border: 1px solid #374151; border-radius: 10px; color: white; box-sizing: border-box; outline: none; text-align: left; font-size: 14px;" dir="ltr">
        </div>

        <div style="margin-bottom: 22px;">
          <label style="display: block; margin-bottom: 6px; font-size: 13px; color: #d1d5db;">رمز عبور جدید</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" required placeholder="********" 
                 style="width: 100%; padding: 13px; background-color: #262833; border: 1px solid #374151; border-radius: 10px; color: white; box-sizing: border-box; outline: none; text-align: left; font-size: 14px;" dir="ltr">
        </div>

        <button type="submit" style="width: 100%; padding: 13px; background: linear-gradient(135deg, #ec4899 0%, #3b82f6 100%); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);">
          تغییر و تنظیم رمز عبور
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 13px;">
        <a routerLink="/login" style="color: #60a5fa; text-decoration: none; font-weight: bold;">← بازگشت به صفحه ورود</a>
      </div>

    </div>
  </div>

  <!-- بخش دکوراتیو در سمت راست با گرادینت صورتی و آبی هماهنگ -->
  <div style="flex: 1; background: linear-gradient(135deg, #2e1065 0%, #4c1d95 40%, #2563eb 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 50px; color: white; text-align: right;" dir="rtl">
    <div style="max-width: 420px;">
      <h1 style="font-size: 34px; font-weight: bold; margin-bottom: 18px; line-height: 1.3; color: white;">امنیت حساب کاربری، اولویت ماست</h1>
      <p style="font-size: 15px; color: #cbd5e1; line-height: 1.6; margin: 0;">با خیال راحت رمز عبور جدید خود را تعریف کنید و به راحتی به پنل مدیریت خود بازگردید.</p>
    </div>
  </div>

</div>
