<main
  dir="rtl"
  class="min-h-screen bg-slate-950 px-4 py-10 text-white"
>
  <section class="mx-auto w-full max-w-md">

    <!-- Header -->
    <div class="mb-8 text-center">

      <div
        class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-500/10 text-2xl text-blue-400"
      >
        🔐
      </div>

      <h1 class="text-2xl font-bold text-white">
        بازیابی رمز عبور
      </h1>

      <p class="mt-3 text-sm leading-6 text-slate-500">
        شماره موبایل خود را وارد کنید تا کد تأیید برای شما ارسال شود.
      </p>

    </div>


    <!-- Form -->
    <form
      (ngSubmit)="sendResetCode()"
      class="space-y-5 rounded-3xl border border-slate-800 bg-slate-900/60 p-6 shadow-2xl"
    >

      <!-- Phone -->
      <div>

        <label
          for="phone"
          class="mb-2 block text-sm font-medium text-slate-300"
        >
          شماره موبایل
        </label>

        <input
          id="phone"
          name="phone"
          type="tel"
          [(ngModel)]="phone"
          placeholder="09123456789"
          autocomplete="tel"
          class="h-14 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 text-left text-white outline-none transition placeholder:text-slate-600 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          dir="ltr"
          required
        />

      </div>


      <!-- Info -->
      <div
        class="flex gap-3 rounded-2xl border border-blue-400/10 bg-blue-400/5 p-4"
      >

        <div
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-blue-400/10 text-sm text-blue-300"
        >
          i
        </div>

        <p class="text-xs leading-6 text-slate-500">
          اگر شماره موبایل شما در سامانه ثبت شده باشد،
          کد تأیید برای شما ارسال خواهد شد.
        </p>

      </div>


      <!-- Message -->
      <div
        *ngIf="message"
        class="rounded-2xl border px-4 py-3 text-sm leading-6"
        [ngClass]="
          messageType === 'success'
            ? 'border-emerald-400/20 bg-emerald-400/10 text-emerald-300'
            : 'border-red-400/20 bg-red-400/10 text-red-300'
        "
      >
        {{ message }}
      </div>


      <!-- Button -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="group relative h-14 w-full overflow-hidden rounded-2xl bg-gradient-to-l from-blue-500 to-sky-500 font-bold text-white shadow-[0_12px_35px_rgba(37,99,235,0.22)] transition duration-300 hover:-translate-y-0.5 hover:shadow-[0_18px_45px_rgba(59,130,246,0.3)] disabled:cursor-not-allowed disabled:opacity-60"
      >

        <!-- Shine -->
        <span
          class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/15 to-transparent transition duration-700 group-hover:translate-x-full"
        ></span>

        <span class="relative flex items-center justify-center gap-2">

          <span
            *ngIf="isLoading"
            class="h-5 w-5 animate-spin rounded-full border-2 border-white/30 border-t-white"
          ></span>

          <span>
            {{
              isLoading
                ? 'در حال ارسال...'
                : 'دریافت کد تأیید'
            }}
          </span>

        </span>

      </button>

    </form>


    <!-- Login -->
    <div class="mt-7 text-center">

      <a
        routerLink="/login"
        class="group inline-flex items-center gap-2 text-sm text-slate-500 transition hover:text-blue-400"
      >

        <span
          class="transition-transform duration-300 group-hover:-translate-x-1"
        >
          ←
        </span>

        بازگشت به صفحه ورود

      </a>

    </div>


    <!-- Footer -->
    <p class="mt-5 text-center text-[11px] text-slate-600">
      اطلاعات شما با بالاترین سطح امنیت محافظت می‌شود
    </p>

  </section>
</main>
