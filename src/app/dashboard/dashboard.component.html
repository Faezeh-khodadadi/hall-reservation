<div class="min-h-screen bg-slate-900 text-slate-100" dir="rtl">
  
  <!-- هدر بالا -->
  <header class="bg-slate-950 border-b border-slate-800 px-8 py-5 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <span class="w-3.5 h-3.5 bg-amber-500 rounded-full animate-pulse"></span>
      <h1 class="text-xl font-bold tracking-wide text-white">سامانه جامع رزرو سالن و تالار</h1>
    </div>
    <button (click)="logout()" class="px-4 py-2 bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white rounded-lg text-sm font-semibold transition">
      خروج از حساب
    </button>
  </header>

  <!-- محتوای اصلی - گرید سالن‌ها -->
  <main class="max-w-7xl mx-auto px-6 py-12">
    <div class="mb-10 text-center">
      <h2 class="text-3xl font-extrabold mb-3 text-white">لیست سالن‌های مراسم و همایش</h2>
      <p class="text-slate-400 text-sm">سالن مورد نظر خود را انتخاب کرده و اطلاعات یا فرم رزرو را تکمیل کنید</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      
      <div *ngFor="let salon of salons" class="bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-amber-500/40 transition duration-300 flex flex-col justify-between">
        
        <!-- عکس و گالری -->
        <div class="relative h-56 bg-slate-900">
          <img [src]="salon.images[salon.currentImageIndex]" [alt]="salon.name" class="w-full h-full object-cover">
          <div class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full text-xs font-semibold text-amber-400 border border-amber-500/20">
            ظرفیت: {{ salon.capacity }}
          </div>
        </div>

        <!-- متن‌ها و جزئیات -->
        <div class="p-6 flex-1 flex flex-col justify-between">
          <div>
            <h3 class="text-xl font-bold mb-2 text-white">{{ salon.name }}</h3>
            <p class="text-slate-400 text-xs leading-relaxed mb-4">{{ salon.description }}</p>
            <div class="text-amber-400 font-bold text-sm mb-6">
              {{ salon.price }}
            </div>
          </div>

          <!-- دو دکمه مشابه نمونه (مشاهده اطلاعات و رزرو سالن) -->
          <div class="flex gap-3">
            <button (click)="viewDetails(salon.id)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl text-xs font-bold transition border border-slate-700 text-center">
              مشاهده اطلاعات
            </button>
            <button [routerLink]="['/reservation', salon.id]" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-2.5 rounded-xl text-xs font-extrabold transition shadow-lg shadow-amber-500/20 text-center">
              رزرو سالن
            </button>
          </div>

        </div>

      </div>

    </div>
  </main>
</div>
