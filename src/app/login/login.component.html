
<div class="min-h-screen flex bg-slate-900" dir="rtl">
  
  <!-- بخش راست: گرافیک و متن خوش‌آمدگویی سالن -->
  <div class="hidden lg:flex lg:w-1/2 relative bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 items-center justify-center p-12 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-pink-500/20 rounded-full blur-3xl"></div>
    
    <div class="relative z-10 text-right max-w-lg">
      <span class="inline-block px-4 py-1.5 rounded-full bg-purple-500/20 text-purple-300 font-semibold text-sm mb-6 border border-purple-500/30">
         سامانه هوشمند مدیریت و رزرو
      </span>
      <h1 class="text-4xl lg:text-5xl font-black text-white leading-tight mb-6">
        دوباره سلام! به حساب کاربری خود <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">وارد شوید</span>
      </h1>
      <p class="text-slate-300 text-base leading-relaxed">
        برای مدیریت رزروها، مشاهده نوبت‌های قبلی و ثبت درخواست‌های جدید، وارد پنل خود شوید.
      </p>
    </div>
  </div>

  <!-- بخش چپ: فرم لاگین مدرن و شیشه‌ای -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 bg-slate-950">
    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-slate-800">
      
      <!-- هدر فرم -->
      <div class="text-center mb-8">
        <h2 class="text-2xl font-black text-white">ورود به سیستم</h2>
        <p class="text-sm text-slate-400 mt-2">اطلاعات کاربری خود را وارد کنید</p>
      </div>

      <!-- فیلد ایمیل -->
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-300 mb-2 uppercase tracking-wider">ایمیل یا نام کاربری</label>
        <input type="email" [(ngModel)]="email" placeholder="name@example.com" 
          class="w-full px-4 py-3.5 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
      </div>

      <!-- فیلد رمز عبور -->
      <div class="mb-6 relative">
        <label class="block text-xs font-bold text-slate-300 mb-2 uppercase tracking-wider">رمز عبور</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="••••••••" 
            class="w-full px-4 py-3.5 bg-slate-800/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
          
          <!-- دکمه آیکون چشم -->
          <button type="button" (click)="togglePassword()" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-purple-400 focus:outline-none">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.027 10.027 0 014.132-5.411m3.635-1.42A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-3.635 1.42l-2.122-2.121M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
            </svg>
          </button>
        </div>
      </div>


<!-- دکمه ورود -->
      <button (click)="onLogin()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3.5 rounded-xl hover:from-purple-500 hover:to-indigo-500 shadow-lg shadow-purple-600/30 transition font-bold text-base tracking-wide">
        ورود به پنل کاربری
      </button>

      <!-- لینک ثبت‌نام -->
      <div class="mt-6 text-center">
        <p class="text-sm text-slate-400">حساب کاربری ندارید؟ 
          <a routerLink="/register" class="text-purple-400 font-bold hover:underline">ثبت‌نام کنید</a>
        </p>
        <a routerLink="/forgot-password" style="color:#9ca3af; font-size: 13px;text-decoration: none;">رمز عبور خود را فراموش کرده اید ؟</a>
      </div>

      <!-- پیام وضعیت -->
      <div class="mt-4 text-center text-sm font-semibold text-red-400">
        {{ message }}
      </div>

    </div>
  </div>

</div>
